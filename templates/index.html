<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Fake Profile Detector</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:linear-gradient(135deg,#00c6ff,#0072ff);

            padding:20px;
        }

        .container{

            width:460px;

            background:rgba(255,255,255,0.15);

            backdrop-filter:blur(12px);

            border:1px solid rgba(255,255,255,0.2);

            border-radius:25px;

            padding:35px;

            color:white;

            box-shadow:0 8px 32px rgba(0,0,0,0.25);
        }

        h1{

            text-align:center;

            font-size:46px;

            margin-bottom:30px;

            font-weight:700;
        }

        .toggle-buttons{

            display:flex;

            gap:10px;

            margin-bottom:25px;
        }

        .toggle-buttons button{

            flex:1;

            padding:14px;

            border:none;

            border-radius:12px;

            background:rgba(255,255,255,0.2);

            color:white;

            font-size:16px;

            cursor:pointer;

            transition:0.3s;
        }

        .toggle-buttons button:hover{

            background:white;

            color:#0072ff;
        }

        .section{

            display:none;

            animation:fade 0.4s ease;
        }

        .active{
            display:block;
        }

        @keyframes fade{

            from{
                opacity:0;
                transform:translateY(10px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        input,
        textarea{

            width:100%;

            padding:15px;

            margin:12px 0;

            border:none;

            outline:none;

            border-radius:14px;

            background:rgba(255,255,255,0.2);

            color:white;

            font-size:17px;
        }

        input::placeholder,
        textarea::placeholder{
            color:#f1f1f1;
        }

        textarea{

            resize:none;

            height:100px;
        }

        .upload-box{

            border:2px dashed rgba(255,255,255,0.5);

            padding:30px;

            border-radius:15px;

            text-align:center;

            margin-top:15px;
        }

        .upload-box h3{
            margin-bottom:15px;
        }

        .submit-btn{

            width:100%;

            padding:16px;

            margin-top:25px;

            border:none;

            border-radius:15px;

            background:white;

            color:#0072ff;

            font-size:22px;

            font-weight:bold;

            cursor:pointer;

            transition:0.3s;
        }

        .submit-btn:hover{

            transform:scale(1.03);

            background:#e8f0ff;
        }

        .result{

            background:rgba(255,255,255,0.2);

            padding:30px;

            border-radius:20px;

            animation:fade 0.5s ease;
        }

        .result h2{

            text-align:center;

            font-size:40px;

            margin-bottom:15px;
        }

        .result h3{

            font-size:28px;

            margin-top:10px;
        }

        .result ul{

            margin-top:15px;

            padding-left:25px;

            font-size:20px;

            line-height:2;
        }

        .form-container{
            display:block;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🔍 AI Fake Profile Detector</h1>

    {% if not result %}

    <form action="/predict"
          method="POST"
          enctype="multipart/form-data"
          class="form-container">

        <div class="toggle-buttons">

            <button type="button"
                    onclick="showSection('details')">

                Enter Details

            </button>

            <button type="button"
                    onclick="showSection('image')">

                Upload Screenshot

            </button>

        </div>

        <!-- DETAILS SECTION -->

        <div id="details" class="section active">

            <input type="number"
                   name="followers"
                   placeholder="Followers">

            <input type="number"
                   name="following"
                   placeholder="Following">

            <input type="number"
                   name="posts"
                   placeholder="Posts">

            <input type="text"
                   name="username"
                   placeholder="Username">

            <textarea name="bio"
                      placeholder="Profile Bio"></textarea>

        </div>

        <!-- IMAGE SECTION -->

        <div id="image" class="section">

            <div class="upload-box">

                <h3>Upload Instagram Screenshot</h3>

                <input type="file"
                       name="profile_image"
                       accept="image/*">

            </div>

        </div>

        <button class="submit-btn"
                type="submit">

            Check Profile

        </button>

    </form>

    {% endif %}

    <!-- RESULT SECTION -->

    {% if result %}

    <div class="result">

        <h2>{{ result }}</h2>

        <h3 style="text-align:center;">

            Fake Probability: {{ score }}%

        </h3>

        <br>

        <h3>Analysis Report</h3>

        <ul>

            {% for reason in reasons %}
                <li>{{ reason }}</li>
            {% endfor %}

        </ul>

        <br><br>

        <button
            onclick="window.location.href='/'"
            class="submit-btn">

            Analyze Another Profile

        </button>

    </div>

    {% endif %}

</div>

<script>

function showSection(sectionId){

    document
        .getElementById("details")
        .classList
        .remove("active");

    document
        .getElementById("image")
        .classList
        .remove("active");

    document
        .getElementById(sectionId)
        .classList
        .add("active");
}

</script>

</body>

</html>
